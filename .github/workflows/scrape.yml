name: Scrape LiveSportsOnTV

on:
  schedule:
    # 16:00 UTC = 00:00 WITA (UTC+8)
    - cron: "0 16 * * *"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/scrape.yml"
  workflow_dispatch:
    inputs:
      skip_ingest:
        description: >-
          Lewati langkah ingest (hanya scrape + commit). Pakai saat aggregator
          sedang maintenance, bukan untuk menyembunyikan error.
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: livesportsontv-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DASHBOARD_INGEST_URL: https://schedule.jerconetwork.com/api/ingest/v2
      DASHBOARD_INGEST_TOKEN: ${{ secrets.DASHBOARD_INGEST_TOKEN }}
      MINIMUM_INGEST_FIXTURES: "200"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Validate ingest configuration
        if: ${{ !inputs.skip_ingest }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DASHBOARD_INGEST_TOKEN:-}" ]; then
            echo "Missing required GitHub secret: DASHBOARD_INGEST_TOKEN" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      - name: Scrape fixtures
        env:
          NUM_DAYS: "7"
          OUTPUT_FILE: data/fixtures.json
        run: npm run scrape

      - name: Generate readable CSV
        env:
          INPUT_FILE: data/fixtures.json
          CSV_OUTPUT_FILE: exports/LiveSportsOnTV-Schedule-WITA.csv
        run: npm run export:csv

      - name: Ingest to dashboard aggregator
        if: ${{ !inputs.skip_ingest }}
        env:
          INPUT_FILE: data/fixtures.json
        run: npm run ingest

      - name: Commit schedule changes
        run: |
          if git diff --quiet -- data/fixtures.json exports/LiveSportsOnTV-Schedule-WITA.csv; then
            echo "No schedule changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fixtures.json exports/LiveSportsOnTV-Schedule-WITA.csv
          git commit -m "chore(data): update sports schedule"
          git push

      - name: Open or update failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Scrape LiveSportsOnTV gagal';
            const runUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;
            const body =
              `Run gagal pada ${new Date().toISOString()}.\n\n` +
              `Log: ${runUrl}\n\n` +
              `Cek baris \`Dashboard ingest failure:\` dan \`Fixture guard:\` di log. ` +
              `Jangan pakai skip_ingest sebelum penyebabnya jelas.`;
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'sync-failure'
            });
            if (open.length) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: open[0].number, body
              });
            } else {
              await github.rest.issues.create({
                ...context.repo, title, body, labels: ['sync-failure']
              });
            }
